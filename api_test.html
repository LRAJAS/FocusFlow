<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Diagnostic Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .input-section {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #555;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: monospace;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results {
            margin-top: 2rem;
        }

        .result-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .result-card h3 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .model-list {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .model-item {
            padding: 0.75rem;
            border-bottom: 1px solid #e0e0e0;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .model-item:last-child {
            border-bottom: none;
        }

        .model-name {
            color: #667eea;
            font-weight: 600;
        }

        .model-desc {
            color: #666;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85rem;
            margin-top: 1rem;
        }

        .code-block {
            background: #f1f3f5;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            margin-top: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .recommendation {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .recommendation strong {
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Gemini API Diagnostic Tool</h1>
        <p class="subtitle">Check your API configuration and discover available models</p>

        <div class="input-section">
            <label for="apiKey">Enter Your Gemini API Key:</label>
            <input 
                type="text" 
                id="apiKey" 
                placeholder="AIzaSy..."
                value="AIzaSyAFMq32w_CdybQCaVr692704vhZDa7HNGs"
            >
            <button class="btn" id="testBtn" onclick="runDiagnostics()">🚀 Run Full Diagnostics</button>
        </div>

        <div id="results" class="results"></div>
    </div>

    <script>
        async function runDiagnostics() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const resultsDiv = document.getElementById('results');
            const testBtn = document.getElementById('testBtn');
            
            if (!apiKey) {
                resultsDiv.innerHTML = `
                    <div class="result-card">
                        <span class="status error">❌ Error</span>
                        <p>Please enter your API key!</p>
                    </div>
                `;
                return;
            }

            testBtn.disabled = true;
            testBtn.textContent = 'Testing...';
            resultsDiv.innerHTML = '<div class="spinner"></div>';

            let diagnosticResults = '';

            // Test 1: Check v1beta models
            diagnosticResults += await testAPIVersion('v1beta', apiKey);

            // Test 2: Check v1 models
            diagnosticResults += await testAPIVersion('v1', apiKey);

            // Test 3: Test actual generation with different models
            diagnosticResults += await testModelGeneration(apiKey);

            resultsDiv.innerHTML = diagnosticResults;
            testBtn.disabled = false;
            testBtn.textContent = '🚀 Run Full Diagnostics';
        }

        async function testAPIVersion(version, apiKey) {
            try {
                const url = `https://generativelanguage.googleapis.com/${version}/models?key=${apiKey}`;
                const response = await fetch(url);
                const data = await response.json();

                if (response.ok && data.models) {
                    const models = data.models.map(m => ({
                        name: m.name,
                        displayName: m.displayName || 'N/A',
                        description: m.description || 'No description',
                        supportedMethods: m.supportedGenerationMethods || []
                    }));

                    // Find models that support generateContent
                    const contentModels = models.filter(m => 
                        m.supportedMethods.includes('generateContent')
                    );

                    return `
                        <div class="result-card">
                            <h3>API Version: ${version}</h3>
                            <span class="status success">✅ Available</span>
                            <p><strong>Total Models:</strong> ${models.length}</p>
                            <p><strong>Models supporting generateContent:</strong> ${contentModels.length}</p>
                            
                            <div class="model-list">
                                ${contentModels.map(m => `
                                    <div class="model-item">
                                        <div class="model-name">${m.name}</div>
                                        <div class="model-desc">${m.displayName}</div>
                                        <div class="model-desc">Methods: ${m.supportedMethods.join(', ')}</div>
                                    </div>
                                `).join('')}
                            </div>

                            ${contentModels.length > 0 ? `
                                <div class="recommendation">
                                    <strong>✨ Recommended for your code:</strong><br>
                                    Use: <code>${contentModels[0].name}</code>
                                </div>
                                <div class="code-block">
const GEMINI_API_URL = \`https://generativelanguage.googleapis.com/${version}/${contentModels[0].name}:generateContent?key=\${GEMINI_API_KEY}\`;
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    return `
                        <div class="result-card">
                            <h3>API Version: ${version}</h3>
                            <span class="status error">❌ Error</span>
                            <p>${data.error?.message || 'Failed to fetch models'}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                return `
                    <div class="result-card">
                        <h3>API Version: ${version}</h3>
                        <span class="status error">❌ Network Error</span>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function testModelGeneration(apiKey) {
            const modelsToTest = [
                { version: 'v1beta', model: 'models/gemini-pro' },
                { version: 'v1beta', model: 'models/gemini-1.5-flash' },
                { version: 'v1', model: 'models/gemini-1.5-flash' },
                { version: 'v1', model: 'models/gemini-pro' }
            ];

            let results = '<div class="result-card"><h3>🧪 Generation Tests</h3>';

            for (const test of modelsToTest) {
                const url = `https://generativelanguage.googleapis.com/${test.version}/${test.model}:generateContent?key=${apiKey}`;
                
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: 'Say hi' }]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.candidates) {
                        results += `
                            <div style="margin: 1rem 0; padding: 0.75rem; background: #d4edda; border-radius: 8px;">
                                <strong style="color: #155724;">✅ ${test.version}/${test.model}</strong><br>
                                <small>Response: ${data.candidates[0]?.content?.parts?.[0]?.text || 'OK'}</small>
                            </div>
                        `;
                    } else {
                        results += `
                            <div style="margin: 1rem 0; padding: 0.75rem; background: #f8d7da; border-radius: 8px;">
                                <strong style="color: #721c24;">❌ ${test.version}/${test.model}</strong><br>
                                <small>${data.error?.message || 'Failed'}</small>
                            </div>
                        `;
                    }
                } catch (error) {
                    results += `
                        <div style="margin: 1rem 0; padding: 0.75rem; background: #f8d7da; border-radius: 8px;">
                            <strong style="color: #721c24;">❌ ${test.version}/${test.model}</strong><br>
                            <small>${error.message}</small>
                        </div>
                    `;
                }
            }

            results += '</div>';
            return results;
        }
    </script>
</body>
</html>
